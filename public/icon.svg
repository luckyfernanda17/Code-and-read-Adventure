<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle with border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#FDE68A" stroke-width="12" />

  <!-- Open Book Symbol (Reading) -->
  <path d="M120 320 C180 300 230 310 256 330 C282 310 332 300 392 320 L392 200 C332 180 282 190 256 210 C230 190 180 180 120 200 Z" fill="url(#bookGrad)" stroke="#78350F" stroke-width="10" stroke-linejoin="round" />
  <line x1="256" y1="210" x2="256" y2="330" stroke="#78350F" stroke-width="8" stroke-linecap="round" />

  <!-- Code Blocks Emblem (Coding) -->
  <!-- Top Block -->
  <rect x="196" y="110" width="120" height="44" rx="10" fill="#3B82F6" stroke="#1E3A8A" stroke-width="6" />
  <text x="256" y="138" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">MAJU ➔</text>

  <!-- Large Magnifying Glass (Detective) -->
  <g transform="translate(180, 160)">
    <circle cx="90" cy="90" r="54" fill="#60A5FA" fill-opacity="0.3" stroke="#FBBF24" stroke-width="14" />
    <circle cx="90" cy="90" r="42" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="10 6" />
    <line x1="130" y1="130" x2="180" y2="180" stroke="#B45309" stroke-width="18" stroke-linecap="round" />
    <line x1="130" y1="130" x2="180" y2="180" stroke="#FDE68A" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Sparkle stars -->
  <polygon points="120,130 126,145 142,145 130,154 134,170 120,160 106,170 110,154 98,145 114,145" fill="#FEF08A" stroke="#CA8A04" stroke-width="3" />
  <polygon points="380,120 385,133 400,133 388,141 392,155 380,146 368,155 372,141 360,133 375,133" fill="#FEF08A" stroke="#CA8A04" stroke-width="3" />

  <!-- Brand Label Ribbon -->
  <rect x="80" y="380" width="352" height="60" rx="20" fill="#1E293B" stroke="#F59E0B" stroke-width="6" />
  <text x="256" y="420" font-family="sans-serif" font-weight="900" font-size="26" fill="#FBBF24" text-anchor="middle" letter-spacing="1">CODE &amp; READ</text>
</svg>
